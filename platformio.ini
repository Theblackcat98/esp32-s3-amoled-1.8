; PlatformIO Project Configuration File
; Target: Waveshare ESP32-S3-Touch-AMOLED-1.8 (V2 Revision)
;   - MCU:     ESP32-S3R8 Dual-Core LX7 @ 240 MHz
;   - Memory:  16 MB QIO Flash + 8 MB Octal (OPI) PSRAM
;   - Display: 1.8" 368x448 QSPI AMOLED (CO5300, col_offset=16)
;   - Touch:   CST820 Capacitive Touch (I2C 0x15)
;   - I/O Exp: TCA9554 (I2C 0x20)
;   - PMIC:    AXP2101 (I2C 0x34)
;   - IMU:     QMI8658 6-Axis (I2C 0x6B)
;   - RTC:     PCF85063A (I2C 0x51)
;   - Audio:   ES8311 Codec (I2C 0x18 + I2S) + Mic + Speaker PA

[platformio]
default_envs = waveshare_s3_amoled_v2
boards_dir = boards

[env:waveshare_s3_amoled_v2]
platform = espressif32@^7.1.3
board = waveshare_esp32_s3_touch_amoled_1_8_v2
framework = arduino

monitor_speed = 115200
monitor_filters =
  esp32_exception_decoder
  time

build_flags =
  -Wall
  -Wextra
  -Wno-unused-parameter
  -DCORE_DEBUG_LEVEL=3
  -DLV_CONF_INCLUDE_SIMPLE
  -DDISABLE_ALL_LIBRARY_WARNINGS
  -I include

lib_deps =
  lvgl/lvgl @ ^8.4.0
  moononournation/GFX Library for Arduino @ 1.4.9
  lewisxhe/SensorLib @ ^0.3.3
  lewisxhe/XPowersLib @ ^0.2.6
