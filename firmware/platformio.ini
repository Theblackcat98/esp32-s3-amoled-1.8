[platformio]
src_dir = main
boards_dir = ../boards
default_envs = waveshare_s3_amoled_v2

[env:waveshare_s3_amoled_v2]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = waveshare_esp32_s3_touch_amoled_1_8_v2
framework = espidf

board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_upload.maximum_size = 4194304

monitor_speed = 115200
monitor_filters =
  esp32_exception_decoder
  time
